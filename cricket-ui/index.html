<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>Cricket Statistics Tracker</title>
    <meta name="description" content="Live cricket scoring and statistics — ball-by-ball scoring, full scorecards, batting and bowling stats, and team management." />

    <!-- Address-bar colour follows the active theme -->
    <meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cricket Statistics Tracker" />
    <meta property="og:description" content="Live cricket scoring and statistics — ball-by-ball scoring, full scorecards, and team management." />
    <meta name="twitter:card" content="summary" />
    <script>
      // Resolve theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var pref = localStorage.getItem('cricket_theme') || 'system';
          var dark = pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
