# Template only. Copy to k8s/secrets.yaml (gitignored) and fill in real values,
# or generate the Secret from your secret manager. Do NOT commit real secrets.
#
#   cp k8s/secrets.example.yaml k8s/secrets.yaml
#   # then set strong, unique values, e.g.:
#   #   JWT_SECRET / POSTGRES_PASSWORD / ADMIN_PASSWORD via:  openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: cricket-secrets
type: Opaque
stringData:
  POSTGRES_USER: cricket
  POSTGRES_PASSWORD: __REPLACE_ME__
  POSTGRES_DB: cricket
  JWT_SECRET: __REPLACE_ME__
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: __REPLACE_ME__

